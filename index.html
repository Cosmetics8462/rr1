    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* الإطار الخارجي البطاقة */
        .card-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #141414 0%, #080808 100%);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 28px;
            padding: 35px 20px 25px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        /* العنوان الرئيسي */
        .welcome-title {
            font-size: 20px;
            color: #d1d1d1;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .store-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .store-title span {
            color: #e5b842;
        }

        /* دائرة الشعار مع الحركة والتوثيق */
        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 25px auto;
            cursor: pointer;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #e5b842;
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 15px rgba(229, 184, 66, 0.2);
        }

        .logo-circle svg {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        /* الشارة الموثقة الذهبية */
        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 4px;
            width: 26px;
            height: 26px;
            background: #111111;
            border: 2px solid #e5b842;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            color: #e5b842;
            font-size: 14px;
            font-weight: bold;
        }

        /* النبض المتحرك خلف الشعار */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 1.5px solid rgba(229, 184, 66, 0.6);
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        /* الخط الفاصل */
        .divider {
            position: relative;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(229, 184, 66, 0.4), transparent);
            margin: 20px 0 30px 0;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #e5b842;
            border-radius: 50%;
            box-shadow: 0 0 8px #e5b842;
        }

        /* قسم النص الواتس */
        .click-here {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .contact-subtext {
            font-size: 18px;
            font-weight: 700;
            color: #25d366;
            margin-bottom: 25px;
        }

        /* زر الواتساب الدائري الكبير */
        .main-whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            background: transparent;
            text-decoration: none;
            margin-bottom: 30px;
            transition: transform 0.25s ease;
            position: relative;
        }

        .main-whatsapp-btn:hover {
            transform: scale(1.06);
        }

        .main-whatsapp-btn:active {
            transform: scale(0.95);
        }

        .main-whatsapp-btn svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(37, 211, 102, 0.45));
        }

        /* خط فاصل سفلي */
        .bottom-divider {
            height: 2px;
            background: #e5b842;
            width: 90%;
            margin: 0 auto 25px auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(229, 184, 66, 0.3);
        }

        /* الزر الذهبي العريض للطلب */
        .gold-order-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: linear-gradient(135deg, #f3ca52 0%, #caa030 100%);
            color: #000000;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(229, 184, 66, 0.25);
            transition: all 0.25s ease;
            margin-bottom: 15px;
        }

        .gold-order-btn:hover {
            background: linear-gradient(135deg, #fbd868 0%, #d4aa37 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 184, 66, 0.4);
        }

        .gold-order-btn:active {
            transform: translateY(1px);
        }

        .gold-order-btn .icon-circle {
            width: 38px;
            height: 38px;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gold-order-btn .icon-circle svg {
            width: 22px;
            height: 22px;
            fill: #000000;
        }

        .arrow-icon {
            font-size: 22px;
            font-weight: 900;
        }

        /* النص الإرشادي السفلي */
        .footer-info {
            font-size: 13px;
            color: #888888;
            line-height: 1.6;
            font-weight: 500;
        }
    </style>
</head>
